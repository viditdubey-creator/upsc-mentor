<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPSC AI Mentor</title>

  <style>

    body{
      margin:0;
      font-family:Arial;
      background:#f4f7fb;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .container{
      width:400px;
      height:85vh;
      background:white;
      border-radius:20px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      box-shadow:0 10px 30px rgba(0,0,0,0.1);
    }

    .header{
      background:#0b3d91;
      color:white;
      text-align:center;
      padding:20px;
      font-size:28px;
      font-weight:bold;
    }

    .chat-box{
      flex:1;
      overflow-y:auto;
      padding:15px;
      background:#f7f9fc;
    }

    .user{
      background:#0b3d91;
      color:white;
      padding:12px;
      border-radius:15px;
      margin:10px 0;
      margin-left:auto;
      width:fit-content;
      max-width:80%;
    }

    .bot{
      background:#e8eeff;
      padding:12px;
      border-radius:15px;
      margin:10px 0;
      max-width:80%;
    }

    .input-area{
      display:flex;
      padding:10px;
      gap:10px;
      border-top:1px solid #ddd;
    }

    input{
      flex:1;
      padding:12px;
      border-radius:10px;
      border:1px solid #ccc;
      font-size:16px;
    }

    button{
      background:#0b3d91;
      color:white;
      border:none;
      padding:12px 20px;
      border-radius:10px;
      cursor:pointer;
      font-size:16px;
    }

  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      UPSC AI Mentor
    </div>

    <div class="chat-box" id="chatBox">

      <div class="bot">
        Hello Aspirant 👋<br><br>
        Ask any UPSC question.
      </div>

    </div>

    <div class="input-area">

      <input
        type="text"
        id="userInput"
        placeholder="Ask your question..."
      >

      <button id="sendBtn">
        Send
      </button>

    </div>

  </div>

<script>

const sendBtn = document.getElementById("sendBtn");

const userInput = document.getElementById("userInput");

const chatBox = document.getElementById("chatBox");

// TEST BUTTON
sendBtn.onclick = function(){

  const message = userInput.value;

  if(message.trim() === "") return;

  const div = document.createElement("div");

  div.className = "user";

  div.innerHTML = message;

  chatBox.appendChild(div);

  userInput.value = "";

};

</script>

</body>
</html>
