<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPSC AI Mentor</title>

  <style>

    body{
      margin:0;
      font-family:Arial;
      background:#f4f7fb;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .container{
      width:400px;
      height:85vh;
      background:white;
      border-radius:20px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      box-shadow:0 10px 30px rgba(0,0,0,0.1);
    }

    .header{
      background:#0b3d91;
      color:white;
      text-align:center;
      padding:20px;
      font-size:28px;
      font-weight:bold;
    }

    .chat-box{
      flex:1;
      overflow-y:auto;
      padding:15px;
      background:#f7f9fc;
    }

    .user{
      background:#0b3d91;
      color:white;
      padding:12px;
      border-radius:15px;
      margin:10px 0;
      margin-left:auto;
      width:fit-content;
      max-width:80%;
    }

    .bot{
      background:#e8eeff;
      padding:12px;
      border-radius:15px;
      margin:10px 0;
      max-width:80%;
    }

    .input-area{
      display:flex;
      padding:10px;
      gap:10px;
      border-top:1px solid #ddd;
    }

    input{
      flex:1;
      padding:12px;
      border-radius:10px;
      border:1px solid #ccc;
      font-size:16px;
    }

    button{
      background:#0b3d91;
      color:white;
      border:none;
      padding:12px 20px;
      border-radius:10px;
      cursor:pointer;
      font-size:16px;
    }

  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      UPSC AI Mentor
    </div>

    <div class="chat-box" id="chatBox">

      <div class="bot">
        Hello Aspirant 👋<br><br>
        Ask any UPSC question.
      </div>

    </div>

    <div class="input-area">

      <input
        type="text"
        id="userInput"
        placeholder="Ask your question..."
      >

      <button id="sendBtn">
        Send
      </button>

    </div>

  </div>

<script>

const OPENAI_API_KEY = "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
";

const sendBtn = document.getElementById("sendBtn");
const userInput = document.getElementById("userInput");
const chatBox = document.getElementById("chatBox");

sendBtn.onclick = async function () {

  const message = userInput.value.trim();

  if (!message) return;

  // USER MESSAGE
  const userDiv = document.createElement("div");

  userDiv.className = "user";

  userDiv.innerHTML = message;

  chatBox.appendChild(userDiv);

  userInput.value = "";

  // BOT TYPING
  const typingDiv = document.createElement("div");

  typingDiv.className = "bot";

  typingDiv.id = "typing";

  typingDiv.innerHTML = "Typing...";

  chatBox.appendChild(typingDiv);

  chatBox.scrollTop = chatBox.scrollHeight;

  try {

    const response = await fetch(
      "https://api.openai.com/v1/chat/completions",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${OPENAI_API_KEY}`
        },

        body: JSON.stringify({

          model: "gpt-3.5-turbo",

          messages: [

            {
              role: "system",
              content: `
You are UPSC AI Mentor.

Rules:
- Reply only in 4-5 lines
- Give concise UPSC guidance
- No coaching references
- No competitor mentions
- No YouTube suggestions
              `
            },

            {
              role: "user",
              content: message
            }

          ],

          max_tokens: 150,
          temperature: 0.7

        })

      }
    );

    const data = await response.json();

    console.log(data);

    // REMOVE TYPING
    document.getElementById("typing").remove();

    // API ERROR
    if (data.error) {

      const errorDiv = document.createElement("div");

      errorDiv.className = "bot";

      errorDiv.innerHTML =
        "API Error: " + data.error.message;

      chatBox.appendChild(errorDiv);

      return;
    }

    // BOT REPLY
    const reply =
      data.choices[0].message.content;

    const botDiv = document.createElement("div");

    botDiv.className = "bot";

    botDiv.innerHTML =
      reply.replace(/\n/g, "<br>");

    chatBox.appendChild(botDiv);

    chatBox.scrollTop = chatBox.scrollHeight;

  }
  catch (error) {

    console.log(error);

    document.getElementById("typing").remove();

    const errorDiv = document.createElement("div");

    errorDiv.className = "bot";

    errorDiv.innerHTML =
      "Connection Error";

    chatBox.appendChild(errorDiv);

  }

};

</script>
