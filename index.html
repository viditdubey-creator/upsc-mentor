<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPSC AI Mentor</title>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#f4f7fb;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.chat-container{
  width:420px;
  height:90vh;
  background:white;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
  display:flex;
  flex-direction:column;
}

.chat-header{
  background:#0b3d91;
  color:white;
  padding:20px;
  text-align:center;
  font-size:28px;
  font-weight:bold;
}

.chat-box{
  flex:1;
  overflow-y:auto;
  padding:15px;
  background:#f7f9fc;
}

.user-message{
  background:#0b3d91;
  color:white;
  padding:12px;
  border-radius:15px;
  margin:10px 0;
  margin-left:auto;
  width:fit-content;
  max-width:80%;
}

.bot-message{
  background:#e8eeff;
  color:black;
  padding:12px;
  border-radius:15px;
  margin:10px 0;
  max-width:80%;
}

.input-area{
  display:flex;
  padding:10px;
  gap:10px;
  border-top:1px solid #ddd;
}

input{
  flex:1;
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
}

button{
  background:#0b3d91;
  color:white;
  border:none;
  padding:12px 18px;
  border-radius:10px;
  cursor:pointer;
}

</style>
</head>

<body>

<div class="chat-container">

  <div class="chat-header">
    UPSC AI Mentor
  </div>

  <div class="chat-box" id="chatBox">

    <div class="bot-message">
      Hello Aspirant 👋<br><br>
      Ask any UPSC-related question.
    </div>

  </div>

  <div class="input-area">

    <input
      type="text"
      id="userInput"
      placeholder="Ask your UPSC question..."
    >

    <button id="sendBtn">
      Send
    </button>

  </div>

</div>

<script>

const chatBox = document.getElementById("chatBox");
const userInput = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

// PUT NEW API KEY HERE
const OPENAI_API_KEY = "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
";

async function sendMessage(){

  const message = userInput.value.trim();

  if(!message) return;

  addMessage(message, "user");

  userInput.value = "";

  try{

    const response = await fetch(
      "https://api.openai.com/v1/chat/completions",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json",
          "Authorization":`Bearer ${OPENAI_API_KEY}`
        },

        body:JSON.stringify({

          model:"gpt-3.5-turbo",

          messages:[
            {
              role:"system",
              content:`
You are UPSC AI Mentor.

Rules:
- Reply in 4-5 lines only
- Concise UPSC guidance
- No coaching references
- No competitor mentions
- No YouTube suggestions
              `
            },

            {
              role:"user",
              content:message
            }
          ],

          max_tokens:150
        })
      }
    );

    const data = await response.json();

    console.log(data);

    if(data.error){

      addMessage(data.error.message, "bot");

      return;
    }

    const reply =
      data.choices[0].message.content;

    addMessage(reply, "bot");

  }
  catch(error){

    console.log(error);

    addMessage(
      "Error connecting API",
      "bot"
    );

  }

}

function addMessage(text, sender){

  const div = document.createElement("div");

  div.className =
    sender === "user"
    ? "user-message"
    : "bot-message";

  div.innerHTML = text.replace(/\n/g,"<br>");

  chatBox.appendChild(div);

  chatBox.scrollTop = chatBox.scrollHeight;
}

sendBtn.addEventListener(
  "click",
  sendMessage
);

userInput.addEventListener(
  "keypress",
  function(e){
    if(e.key === "Enter"){
      sendMessage();
    }
  }
);

</script>

</body>
</html>
